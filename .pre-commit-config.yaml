repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^otter/models/architectures/spherical_harmonics/spherical_harmonics_ylm\.py$
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check otter tests setup.py --fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format otter tests setup.py
        language: system
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check otter tests setup.py
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: env TORCH_COMPILE_DISABLE=1 uv run pytest tests/
        language: system
        pass_filenames: false
